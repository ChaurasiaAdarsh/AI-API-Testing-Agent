version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: api-testing-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-api_testing}
      POSTGRES_USER: ${DATABASE_USERNAME:-apitest}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-apitest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-apitest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-testing-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-api_testing}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-apitest}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-apitest}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      APP_TESTING_DEMO_MODE: ${APP_TESTING_DEMO_MODE:-false}
      APP_TESTING_ALLOWED_HOSTS: ${APP_TESTING_ALLOWED_HOSTS:-}
      APP_DEMO_DEFECTS_ENABLED: ${APP_DEMO_DEFECTS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-testing-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
