spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2

app:
  testing:
    demo-mode: false
    allowed-hosts: localhost,127.0.0.1
    max-concurrency: 5
    timeout-seconds: 10
    max-generated-tests: 50
  demo:
    defects-enabled: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000
