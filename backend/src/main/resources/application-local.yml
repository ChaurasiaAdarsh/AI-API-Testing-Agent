spring:
  datasource:
    url: jdbc:h2:mem:apitestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.1
          format: json

app:
  testing:
    demo-mode: false
    allowed-hosts: localhost,127.0.0.1
    max-concurrency: 5
    timeout-seconds: 10
    max-endpoints: 100
    max-generated-tests: 100
    max-response-body-bytes: 10240
  demo:
    defects-enabled: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.apitest.agent: INFO
    root: INFO
