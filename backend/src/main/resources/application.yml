spring:
  application:
    name: ai-api-testing-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/api_testing}
    username: ${DATABASE_USERNAME:apitest}
    password: ${DATABASE_PASSWORD:apitest}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.1
          format: json

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  testing:
    max-concurrency: ${APP_TESTING_MAX_CONCURRENCY:5}
    timeout-seconds: ${APP_TESTING_TIMEOUT_SECONDS:10}
    demo-mode: ${APP_TESTING_DEMO_MODE:true}
    allowed-hosts: ${APP_TESTING_ALLOWED_HOSTS:}
    max-open-api-file-size-bytes: 1048576
    max-endpoints: 100
    max-generated-tests: 100
    max-response-body-bytes: 10240
  demo:
    defects-enabled: ${APP_DEMO_DEFECTS_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.apitest.agent: DEBUG
    root: INFO
