openapi: "3.0.3"
info:
  title: "User Management API"
  description: |
    A sample User Management API used to demonstrate AI-powered contract testing.
    
    This API is intentionally built into the application at /demo/users endpoints.
    It contains configurable defects to demonstrate contract violation detection:
    
    - POST /demo/users returns HTTP 200 instead of 201 (when defects enabled)
    - PUT /demo/users/{id} omits the updatedAt field from the response
    
    Use this spec to generate tests and discover these violations automatically.
  version: "1.0.0"
  contact:
    name: "AI API Testing Agent"
    email: "demo@example.com"

servers:
  - url: "http://localhost:8080"
    description: "Local development server (demo API)"

tags:
  - name: users
    description: User management operations

paths:
  /demo/users:
    get:
      tags: [users]
      summary: "List all users"
      description: "Returns a paginated list of all users with optional filtering"
      operationId: listUsers
      parameters:
        - name: page
          in: query
          required: false
          description: "Page number (0-based)"
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: "Page size"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          required: false
          description: "Filter by role"
          schema:
            type: string
            enum: [user, admin, moderator]
      responses:
        "200":
          description: "Successful response with paginated users"
          content:
            application/json:
              schema:
                type: object
                required: [users, total, page, size]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  total:
                    type: integer
                    description: "Total number of users"
                    minimum: 0
                  page:
                    type: integer
                    minimum: 0
                  size:
                    type: integer
                    minimum: 1
        "400":
          description: "Invalid query parameters"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [users]
      summary: "Create a new user"
      description: "Creates a new user. Returns HTTP 201 on success."
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              valid:
                summary: "Valid user"
                value:
                  name: "John Doe"
                  email: "john@example.com"
                  age: 25
                  role: "user"
              minimal:
                summary: "Minimal required fields"
                value:
                  name: "Jane"
                  email: "jane@example.com"
                  age: 18
                  role: "user"
      responses:
        "201":
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: "Invalid request body (validation failed)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: "Email already exists"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /demo/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: "User ID"
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      tags: [users]
      summary: "Get user by ID"
      description: "Retrieves a user by their unique ID"
      operationId: getUserById
      responses:
        "200":
          description: "User found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [users]
      summary: "Update user"
      description: "Updates an existing user's information"
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        "200":
          description: "User updated successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: "Invalid request body"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [users]
      summary: "Delete user"
      description: "Permanently deletes a user. Returns 204 with no body on success."
      operationId: deleteUser
      responses:
        "204":
          description: "User deleted successfully (no body)"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateUserRequest:
      type: object
      required: [name, email, age, role]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: "User's full name"
          example: "John Doe"
        email:
          type: string
          format: email
          maxLength: 255
          description: "User's unique email address"
          example: "john@example.com"
        age:
          type: integer
          minimum: 18
          maximum: 120
          description: "User's age. Must be at least 18."
          example: 25
        role:
          type: string
          enum: [user, admin, moderator]
          description: "User's role in the system"
          example: "user"
        bio:
          type: string
          maxLength: 500
          description: "Optional user biography"
          nullable: true
          example: "Software developer from NYC"

    UpdateUserRequest:
      type: object
      description: "All fields are optional. Only provided fields are updated."
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: "New name"
        bio:
          type: string
          maxLength: 500
          nullable: true
          description: "New biography"
        role:
          type: string
          enum: [user, admin, moderator]
          description: "New role"

    UserResponse:
      type: object
      required: [id, name, email, age, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
          description: "Unique user identifier"
          example: 1
        name:
          type: string
          description: "User's full name"
          example: "John Doe"
        email:
          type: string
          description: "User's email address"
          example: "john@example.com"
        age:
          type: integer
          description: "User's age"
          example: 25
        role:
          type: string
          enum: [user, admin, moderator]
          description: "User's role"
          example: "user"
        bio:
          type: string
          nullable: true
          description: "User's biography"
          example: null
        createdAt:
          type: string
          format: date-time
          description: "Account creation timestamp"
          example: "2024-01-15T10:30:00"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: "Last update timestamp"
          example: null

    ErrorResponse:
      type: object
      required: [timestamp, status, error, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          description: "HTTP status code"
        error:
          type: string
          description: "Error type identifier"
        message:
          type: string
          description: "Human-readable error message"
        path:
          type: string
          description: "Request path that caused the error"
